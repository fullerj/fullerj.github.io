# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
author1:
  name:              Jonathan Fuller
  email:             hello@empiricaldefense.com

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
  about:             |
    Jonathan Fuller is the Chief Information Security Officer at the United States Military Academy at West Point, where he leads enterprise cybersecurity strategy, risk governance, and operational resilience in a mission-critical environment. With nearly two decades of Army experience across secure communications, enterprise IT engineering, and organizational leadership, his work focuses on practical security programs that align technology, policy, and people.

    He is also an Assistant Professor and holds a Ph.D. in Electrical and Computer Engineering with a focus on cybersecurity. Through <button type="button" class="definition-trigger" data-definition-target="definition-empiricaldefense">Empirical Defense</button>, he publishes evidence-based analysis that connects technical depth to practical decision-making.

