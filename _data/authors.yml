# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
author1:
  name:              Jonathan Fuller
  email:             hello@empiricaldefense.com

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
  about:             |

    Jonathan Fuller is Chief Information Security Officer at the United States Military Academy at West Point, leading cybersecurity strategy, risk, and operations for a mission-critical enterprise environment. His work focuses on building detection-driven security capabilities that align visibility, control, and response across hybrid and data-driven systems.

    His background spans Army operational leadership, enterprise systems engineering, and adversary-focused research on malware infrastructure and command-and-control systems. He shares analysis on adversary behavior, detection engineering, and AI system security through Empirical Defense.


