<link rel="dns-prefetch" href="https://assets.gumroad.com">
<script type="module">
  const loadJS = x => new Promise(r => window.loadJS(x).addEventListener('load', r));

  let p1, p2, io1, io2, embedCreated, overlayCreated;
  document.querySelector('hy-push-state').addEventListener('load', () => {
    io1 ||= new IntersectionObserver(async (entries) => {
      if (entries.some(x => x.isIntersecting)) {
        p1 = p1 || loadJS('https://gumroad.com/js/gumroad-embed.js');
        await p1;
        !embedCreated && await new Promise(function check1(res) {
          if (typeof createGumroadEmbed !== 'undefined')  {
            embedCreated = 1;
            res(createGumroadEmbed());
          }
          else setTimeout(() => check1(res), 200);
        });
        await new Promise(function check2(res) {
          if (typeof GumroadEmbed !== 'undefined') res(GumroadEmbed.reload());
          else setTimeout(() => check2(res), 200);
        });
      }
    }, { rootMargin: '1440px' });

    io2 ||= new IntersectionObserver(async (entries) => {
      if (entries.some(x => x.isIntersecting)) {
        p2 = p2 || loadJS('https://gumroad.com/js/gumroad.js');
        await p2;
        !overlayCreated && await new Promise(function check(res) {
          if (typeof createGumroadOverlay !== 'undefined') {
            overlayCreated = 1;
            res(createGumroadOverlay());
          }
          else setTimeout(() => check(res), 200);
        });
      }
    }, { rootMargin: '300px' });

    document.querySelectorAll('.gumroad-product-embed').forEach(el => io1.observe(el));
    document.querySelectorAll('.gumroad-button').forEach(el => io2.observe(el));
  });
</script>

{%- assign meta_title = page.title | default: site.title -%}
{%- assign meta_desc = page.excerpt | default: page.description | default: site.description -%}
{%- assign meta_image = page.image | default: site.og_image -%}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_desc | strip_html | strip_newlines | truncate: 200 | escape }}">
<meta property="og:type" content="{%- if page.date -%}article{%- else -%}website{%- endif -%}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if meta_image -%}<meta property="og:image" content="{{ meta_image | absolute_url }}">{%- endif -%}
<meta name="twitter:card" content="{%- if meta_image -%}summary_large_image{%- else -%}summary{%- endif -%}">
<meta name="twitter:title" content="{{ meta_title | escape }}">
<meta name="twitter:description" content="{{ meta_desc | strip_html | strip_newlines | truncate: 200 | escape }}">
{%- if meta_image -%}<meta name="twitter:image" content="{{ meta_image | absolute_url }}">{%- endif -%}

<script>
  // Progressive enhancement: lazy-load and async-decode images sitewide
  document.addEventListener('DOMContentLoaded', function() {
    try {
      var imgs = document.querySelectorAll('img');
      imgs.forEach(function(img) {
        if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
        if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
      });
    } catch (e) {}
  });
  // Hint: If you have a hero/LCP image, set fetchpriority="high" on it in markup.
</script>
